name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MULTILANG_FORBID_NETWORK: "1"
      MULTILANG_FORBID_PROVIDERS: "1"
      MULTILANG_TEXT_GENERATION_PROVIDER: local
      MULTILANG_TRANSLATION_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint all native architecture modules and tests
        run: >-
          uv run --no-sync ruff check
          src/multilang/{api,native_cli,native_runtime,observability,settings}.py
          src/multilang/db/{native_models,task_models}.py
          src/multilang/domain/{anki_semantics,audio_version,content,contracts,datasets,editions,events,language_profiles,learning,lexical_identity,migration,ranking,validation}.py
          src/multilang/jobs src/multilang/security/access.py src/multilang/repositories/native_repository.py
          src/multilang/services/native*.py
          src/multilang/services/{adaptive_queue,anki_history,anki_id_registry,domain_events,language_profiles,legacy_identity_adapter,lexical_pipeline,plugins,ranking,semantic_anki}.py
          alembic/versions/20260912_20_native_architecture.py
          tests/api tests/jobs tests/cli/test_native_commands.py
          tests/domain/test_native*.py tests/repositories/test_native_repository.py
          tests/services/test_native*.py tests/services/test_legacy_identity_adapter.py
          tests/services/test_anki_id_registry.py
          tests/integration/test_native*.py tests/performance
          tests/security/test_native_access.py tests/test_native_observability.py
      - name: Verify migrations and native safety gates
        run: >-
          uv run --no-sync pytest tests/test_migration_schema_parity.py
          tests/services/test_native_migration.py --timeout=120 --tb=short
          --durations=20 --junitxml=test-results/migrations.xml -q
      - name: Regression suite
        run: >-
          uv run --no-sync pytest -n 4 --dist=worksteal --timeout=120 --tb=short
          --ignore=tests/test_migration_schema_parity.py
          --ignore=tests/services/test_native_migration.py
          --ignore=tests/integration
          --ignore=tests/performance
          --ignore=tests/services/test_native_anki_scale.py
          --durations=25 --junitxml=test-results/regression.xml -q
      - name: Integration and scale without competing workers
        run: >-
          uv run --no-sync pytest tests/integration tests/performance
          tests/services/test_native_anki_scale.py --timeout=900 --tb=short
          --durations=25 --junitxml=test-results/integration-scale.xml -q
      - name: Build distribution
        run: uv run --no-sync python -m build --no-isolation
      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-and-docs
          path: |
            dist/
            site/
  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Use matching server/client versions for pg_dump and pg_restore.
    container: postgres:17-bookworm
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: disposable-ci-password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: disposable-ci-password
      MULTILANG_TEST_POSTGRES_SOURCE_URL: postgresql+psycopg://postgres:disposable-ci-password@postgres/multilang_source
      MULTILANG_TEST_POSTGRES_CLONE_URL: postgresql+psycopg://postgres:disposable-ci-password@postgres/multilang_clone
      MULTILANG_FORBID_PROVIDERS: "1"
      MULTILANG_TEXT_GENERATION_PROVIDER: local
      MULTILANG_TRANSLATION_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Prepare disposable databases
        run: |
          createdb multilang_source
          createdb multilang_clone
      - name: Verify PostgreSQL backup and migration rehearsal
        run: >-
          uv run --no-sync pytest tests/jobs/test_native_postgresql.py -q
          --timeout=300 --junitxml=test-results/postgres.xml
      - name: Preserve PostgreSQL test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-results
          path: test-results/
