[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "multilang"
version = "0.1.0"
description = "Multilingual Anki card generator"
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.9,<14.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.8,<3.0",
  "pydantic-ai>=0.0.49,<2.0",
  "litellm>=1.81,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.16,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "deepl>=1.17,<2.0",
  "deep-translator>=1.11,<2.0",
  "wordfreq[jieba]>=3.1,<4.0",
  "gruut[de,es,fr,it,nl,pt,ru,sv]>=2.4,<3.0",
  "phonemizer>=3.3,<4.0",
  "epitran>=1.35,<2.0",
  "azure-cognitiveservices-speech>=1.49,<2.0",
  "genanki>=0.13,<0.14",
  "zstandard>=0.22,<1.0",
  "fugashi>=1.3,<2.0",
  "unidic-lite>=1.0,<2.0",
  "pypinyin>=0.55,<0.56",
  "opencc-python-reimplemented>=0.1.7,<0.2",
]

[project.scripts]
multilang = "multilang.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multilang"]

[tool.hatch.build.targets.wheel.force-include]
"src/multilang/templates" = "multilang/templates"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
