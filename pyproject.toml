[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "multilang"
version = "0.1.0"
description = "Multilingual Anki card generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1.0",
  "uvicorn>=0.35,<1.0",
  "httpx>=0.28,<1.0",
  "opentelemetry-api>=1.35,<2.0",
  "opentelemetry-sdk>=1.35,<2.0",
  "typer>=0.12,<1.0",
  "rich>=13.9,<14.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.8,<3.0",
  "pydantic-ai>=0.0.49,<2.0",
  "litellm>=1.81,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.16,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "deepl>=1.17,<2.0",
  "deep-translator>=1.11,<2.0",
  "wordfreq[jieba]>=3.1,<4.0",
  "gruut[de,es,fr,it,nl,pt,ru,sv]>=2.4,<3.0",
  "phonemizer>=3.3,<4.0",
  "epitran>=1.35,<2.0",
  "azure-cognitiveservices-speech>=1.49,<2.0",
  "genanki>=0.13,<0.14",
  "zstandard>=0.22,<1.0",
  "fugashi>=1.3,<2.0",
  "unidic-lite>=1.0,<2.0",
  "pypinyin>=0.55,<0.56",
  "opencc-python-reimplemented>=0.1.7,<0.2",
  "cutlet>=0.5,<0.6",
  "kiwipiepy==0.23.2",
  "kiwipiepy-model==0.23.0",
  "miniaudio>=1.61,<2",
]

[project.scripts]
multilang = "multilang.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "pytest-xdist>=3.6,<4.0",
  "pytest-timeout>=2.3,<3.0",
  "ruff>=0.12,<1.0",
  "build>=1.2,<2.0",
  "hatchling>=1.25",
  "mkdocs>=1.6,<2.0",
]
nlp = [
    "stanza>=1.11,<2",
    "torch>=2.6,<3",
    "transformers[sentencepiece]>=4.57,<5",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/multilang"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/multilang/**",
  "/alembic/**",
  "/alembic.ini",
  "/pyproject.toml",
  "/uv.lock",
  "/README.md",
  "/data/korean_grammar/v1/**",
]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "multilang/migration_resources/alembic"
"alembic.ini" = "multilang/migration_resources/alembic.ini"
"data/korean_grammar/v1" = "multilang/data/korean_grammar/v1"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811"]
