  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
  #ml-black-reference {
    --ml-black-page: #080d14;
    --ml-black-card: #111820;
    --ml-black-text: #f0f5fc;
    --ml-black-muted: #98a9bb;
    --ml-black-rule: #2a3644;
    --ml-black-blue: #299bff;
    --ml-black-answer: #0d263d;
    --ml-black-answer-text: #75bdff;
    color-scheme: dark;
    font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Arial, sans-serif;
    color: var(--ml-black-text);
    width: 100%;
    min-width: 0;
  }
  #ml-black-reference * { box-sizing: border-box; }
  #ml-black-reference .ml-review {
    background: var(--ml-black-page);
    padding: 24px;
    border-radius: 18px;
  }
  #ml-black-reference .ml-review-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    max-width: 680px;
    margin: 0 auto 18px;
    color: var(--ml-black-muted);
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: .08em;
  }
  #ml-black-reference .ml-review-side { color: var(--ml-black-answer-text); }
  #ml-black-reference .ml-note {
    max-width: 680px;
    margin: 0 auto;
    padding: 34px 36px;
    border: 1px solid var(--ml-black-rule);
    border-radius: 26px;
    background: var(--ml-black-card);
    text-align: left;
    overflow-wrap: anywhere;
  }
  #ml-black-reference .ml-top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 176px;
    align-items: stretch;
    gap: 28px;
  }
  #ml-black-reference .ml-word-pane {
    padding: 18px 0 28px;
    border-bottom: 1px solid var(--ml-black-rule);
    min-width: 0;
  }
  #ml-black-reference .ml-word-line {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  #ml-black-reference .ml-word {
    margin: 0;
    color: var(--ml-black-text);
    font-size: clamp(36px, 7vw, 60px);
    line-height: 1.2;
    letter-spacing: -.035em;
    font-weight: 500;
    min-width: 0;
    white-space: nowrap;
  }
  #ml-black-reference .ml-ipa {
    color: var(--ml-black-muted);
    margin-top: 14px;
    font-size: 23px;
    line-height: 1.5;
    font-weight: 400;
  }
  #ml-black-reference .ml-audio {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    color: var(--ml-black-blue);
    border: 0;
    background: transparent;
  }
  #ml-black-reference .ml-photo {
    position: relative;
    width: 100%;
    aspect-ratio: 233 / 307;
    border-radius: 19px;
    overflow: hidden;
    align-self: start;
    background: #142a43;
  }
  #ml-black-reference .ml-photo img {
    position: absolute;
    width: 481.545065%;
    max-width: none;
    height: auto;
    left: -287.553648%;
    top: -83.061889%;
    display: block;
  }
  #ml-black-reference .ml-definition {
    margin-top: 22px;
    padding-bottom: 26px;
    border-bottom: 1px solid var(--ml-black-rule);
  }
  #ml-black-reference .ml-label {
    color: var(--ml-black-muted);
    font-weight: 400;
    font-size: 17px;
    line-height: 1.5;
    margin: 0 0 8px;
  }
  #ml-black-reference .ml-definition-copy {
    font-size: 24px;
    line-height: 1.5;
    margin: 0;
    font-weight: 400;
  }
  #ml-black-reference .ml-example { margin-top: 22px; }
  #ml-black-reference .ml-example-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 44px;
    align-items: start;
    column-gap: 14px;
  }
  #ml-black-reference .ml-sentence {
    font-size: 23px;
    line-height: 1.5;
    margin: 0;
    font-weight: 400;
    min-width: 0;
  }
  #ml-black-reference .ml-example-grid &gt; .ml-audio { margin-top: -4px; }
  #ml-black-reference .ml-translation {
    grid-column: 1 / -1;
    margin: 12px 0 0 -16px;
    padding: 14px 58px 14px 13px;
    border-left: 3px solid var(--ml-black-blue);
    border-radius: 0 12px 12px 0;
    background: var(--ml-black-answer);
  }
  #ml-black-reference .ml-translation[hidden] { display: none; }
  #ml-black-reference .ml-translation-text {
    margin: 0;
    color: var(--ml-black-answer-text);
    font-size: 21px;
    line-height: 1.5;
    font-weight: 500;
  }
  #ml-black-reference .ml-actions {
    margin-top: 20px;
    display: flex;
    justify-content: center;
  }
  #ml-black-reference .ml-flip {
    font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Arial, sans-serif;
    padding: 11px 22px;
    min-height: 44px;
    border-radius: 9px;
    border: 1px solid #31445b;
    background: #172331;
    color: var(--ml-black-text);
    cursor: pointer;
  }
  #ml-black-reference .ml-flip:hover { background: #203249; }
  @media (max-width: 580px) {
    #ml-black-reference .ml-review { padding: 18px 12px; }
    #ml-black-reference .ml-note { padding: 24px; border-radius: 21px; }
    #ml-black-reference .ml-top { grid-template-columns: minmax(0, 1fr) 108px; gap: 16px; }
    #ml-black-reference .ml-word-pane { padding-top: 6px; padding-bottom: 18px; }
    #ml-black-reference .ml-word { font-size: 38px; }
    #ml-black-reference .ml-word-line { gap: 4px; }
    #ml-black-reference .ml-ipa { font-size: 18px; margin-top: 9px; }
    #ml-black-reference .ml-photo { border-radius: 13px; }
    #ml-black-reference .ml-definition-copy { font-size: 21px; }
    #ml-black-reference .ml-sentence { font-size: 20px; }
    #ml-black-reference .ml-translation-text { font-size: 18px; }
  }
  @media (max-width: 420px) {
    #ml-black-reference .ml-review { padding: 16px 10px; }
    #ml-black-reference .ml-note { padding: 22px 18px; }
    #ml-black-reference .ml-top { grid-template-columns: minmax(0, 1fr) 80px; gap: 10px; }
    #ml-black-reference .ml-word { font-size: 32px; }
    #ml-black-reference .ml-word-line { flex-wrap: wrap; gap: 0; }
    #ml-black-reference .ml-ipa { font-size: 16px; margin-top: 6px; }
    #ml-black-reference .ml-word-pane { padding-top: 0; padding-bottom: 14px; }
    #ml-black-reference .ml-label { font-size: 15px; }
    #ml-black-reference .ml-translation { margin-left: -10px; padding-left: 7px; }
  }

  (() =&gt; {

    const answer = root.querySelector(&quot;.ml-translation&quot;);
    const button = root.querySelector(&quot;.ml-flip&quot;);
    const side = root.querySelector(&quot;.ml-review-side&quot;);
    button.addEventListener(&quot;click&quot;, () =&gt; {
      answer.hidden = !answer.hidden;
      const back = !answer.hidden;
      button.textContent = back ? &quot;Ver frente&quot; : &quot;Mostrar resposta&quot;;
      button.setAttribute(&quot;aria-expanded&quot;, String(back));

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
