<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>09 · Clássico — corrigido</title><style>
    :root {
      color-scheme: dark;
      --color-page-background: #121212;
      --color-card-background: #1E1E1E;
      --color-text-primary: #EAEAEA;
      --color-text-muted: #A0A0A0;
      --color-divider: #333333;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: var(--color-page-background);
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      overflow-x: hidden;
      overflow-wrap: break-word;
      background: var(--color-page-background);
      color: var(--color-text-primary);
      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
    }

    .preview-shell {
      width: min(100%, 1440px);
      margin: 0 auto;
    }

    .preview-heading {
      margin: 0 0 24px;
      color: var(--color-text-primary);
      font-size: 24px;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      gap: 20px;
      width: 100%;
      min-width: 0;
    }

    .anki-window {
      min-width: 0;
      overflow: hidden;
      background: #0B0B0B;
      border: 1px solid var(--color-divider);
      border-radius: 10px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
    }

    .window-chrome {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 40px;
      padding: 10px 12px;
      background: #181818;
      border-bottom: 1px solid var(--color-divider);
      color: var(--color-text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .window-title {
      margin: 0;
      color: var(--color-text-primary);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
    }

    .state-label {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .anki-viewport {
      display: block;
      min-height: 620px;
      padding: 12px;
      background: var(--color-page-background);
    }

    .customCard {
      display: block;
      width: 100%;
      max-width: none;
      min-height: 0;
      margin: 0;
      padding: 28px 24px;
      box-sizing: border-box;
      overflow: hidden;
      overflow-wrap: anywhere;
      background: var(--color-card-background);
      color: var(--color-text-primary);
      border: 1px solid var(--color-divider);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: 16px;
      font-weight: 400;
    }

    .targetWordContainer {
      display: flex;
      justify-content: flex-start;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      width: 100%;
      margin: 0 0 20px;
      text-align: left;
    }

    .wordBlock {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      min-width: 0;
    }

    .targetWord {
      color: var(--color-text-primary);
      font-size: 38px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.5px;
      overflow-wrap: anywhere;
    }

    .ipa {
      margin: 0;
      color: var(--color-text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.3;
    }

    .audioIndicator {
      flex: 0 0 auto;
      color: var(--color-text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      font-style: normal;
      line-height: 1;
      opacity: 0.8;
      user-select: none;
    }

    .dividerLine {
      width: 100%;
      height: 1px;
      margin: 20px 0;
      background: var(--color-divider);
      border: 0;
    }

    .header {
      margin: 0 0 8px;
      color: var(--color-text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .definitionsList {
      margin: 0;
      padding: 0;
      color: var(--color-text-primary);
      list-style: none;
      font-size: 16px;
      line-height: 1.6;
    }

    .definitionsList li {
      margin: 0 0 6px;
    }

    .definitionsList li:last-child {
      margin-bottom: 0;
    }

    .examplePanel {
      margin-top: 6px;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
    }

    .exampleSentenceLine {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 16px;
      line-height: 1.5;
    }

    .exampleSentenceText {
      flex: 1 1 auto;
      min-width: 0;
      color: var(--color-text-primary);
      overflow-wrap: anywhere;
    }

    .sentenceTranslation {
      margin-top: 8px;
      padding: 0;
      color: var(--color-text-muted);
      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: 16px;
      font-weight: 400;
      font-style: normal;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .is-hidden {
      display: none;
    }

    .is-visible {
      display: block;
    }

    @media (max-width: 980px) {
      .preview-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 420px) {
      .anki-viewport {
        padding: 8px;
      }

      .customCard {
        padding: 22px 18px;
      }
    }

html,body.card,body.card.nightMode{margin:0;min-height:100%;}
