<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anki Card - Ergonomic Dark Mode (Preview Conteúdo)</title>
  <style>
    /* PALETA: ERGONOMIC STUDY DARK */
    :root {
      --bg-page: #121212;
      --bg-card: #1E1E1E;
      --text-main: #EAEAEA;
      --text-muted: #A0A0A0;
      --border-line: #333333;
    }

    body {
      background: var(--bg-page);
      color: var(--text-main);
      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
      margin: 0;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .customCard {
      max-width: 460px;
      width: 100%;
      background: var(--bg-card);
      padding: 28px 24px;
      border-radius: 8px;
      border: 1px solid var(--border-line);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    /* Cabeçalho da Palavra */
    .targetWordContainer {
      margin-bottom: 20px;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
    }

    .targetWord {
      font-size: 38px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .ipa {
      font-size: 16px;
      color: var(--text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
    }

    .wordAudioButtonBack {
      margin-left: 4px;
      cursor: pointer;
      opacity: 0.8;
    }

    /* Linhas Divisórias */
    .dividerLine {
      height: 1px;
      background: var(--border-line);
      margin: 20px 0;
      width: 100%;
    }

    /* Seções e Rótulos */
    .header {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .definitionsList {
      padding-left: 0;
      list-style: none;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-main);
      margin: 0;
    }

    .definitionsList li {
      margin-bottom: 6px;
    }

    /* Painel de Exemplo Texto Puro */
    .examplePanel {
      padding: 0;
      margin-top: 6px;
    }

    .exampleSentenceLine {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 16px;
      line-height: 1.5;
    }

    .exampleSentenceText {
      color: var(--text-main);
    }

    .sentenceTranslation {
      margin-top: 8px;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text-muted);
      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
    }

    .sentenceAudioButton {
      cursor: pointer;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="customCard cardBack">
    <!-- PALAVRA CHAVE E PRONÚNCIA -->
    <div class="targetWordContainer">
      <span class="targetWord">Resilience</span>
      <span class="ipa">/rɪˈzɪl.jəns/</span>
      <span class="wordAudioButtonBack">🔊</span>
    </div>

    <div class="dividerLine"></div>

    <!-- DEFINIÇÃO -->
    <div class="horizontalPadding">
      <div class="header">Definition:</div>
      <div class="indent">
        <ul class="definitionsList">
          <li>The capacity to withstand or recover quickly from difficult conditions; toughness.</li>
        </ul>
      </div>
    </div>

    <div class="dividerLine"></div>

    <!-- EXEMPLO -->
    <div class="horizontalPadding">
      <div class="header">Example:</div>
      <div class="examplePanel">
        <div class="exampleSentenceLine">
          <span class="exampleSentenceText">"Her natural resilience helped her overcome the tough challenges."</span>
          <span class="sentenceAudioButton">🔊</span>
        </div>
        <div id="translation" class="sentenceTranslation">
          "Sua resiliência natural a ajudou a superar os difíceis desafios."
        </div>
      </div>
    </div>

  </div>

</body>
</html>
